# Render Blueprint: New > Blueprint > pick this repo.
# (Or create a Web Service by hand with the same build/start commands.)
services:
  - type: web
    name: sharel-report
    runtime: python
    # free = 512 MB, spins down after 15 min idle (first request then waits ~1 min
    # and uploaded reports are gone). 0.5c-512mb ($7/mo) stays up.
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    # ONE worker process: uploads, recompute jobs and progress live in its memory.
    # Threads serve the progress polling while a recompute runs.
    startCommand: gunicorn app:server --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: SHAREL_CACHE_MAX        # reports kept in memory (~25 MB each)
        value: "6"
      - key: SHAREL_MAX_UPLOAD_MB
        value: "25"
      - key: BASIC_AUTH_USER          # optional: set both to password-protect the app
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false
