# Render Blueprint. Based on the export of the live service (2026-09-28), plus the
# settings the app relies on (health check, environment variables).
version: "1"
projects:
- name: edc-report
  environments:
  - name: Production
    services:
    - type: web
      name: edc-report
      runtime: python
      repo: https://github.com/ottapav/edc-report
      # free = 512 MB, sleeps after 15 min without traffic (the next visit waits
      # ~1 min and uploaded reports are gone). 0.5c-512mb ($7/month) stays up.
      plan: free
      region: frankfurt
      buildCommand: pip install -r requirements.txt
      # WSGI object `server` (app:app also works with Dash 4). gunicorn.conf.py pins
      # ONE worker: uploads, key estimates, jobs and their progress live in its memory.
      startCommand: gunicorn app:server -c gunicorn.conf.py
      healthCheckPath: /healthz
      autoDeployTrigger: commit
      envVars:
      - key: EDC_CACHE_MAX            # reports kept in memory (~25 MB each)
        value: "6"
      - key: EDC_MAX_UPLOAD_MB
        value: "25"
      - key: EDC_MAX_JOBS             # computations at once (instance has < 1 CPU)
        value: "2"
      - key: BASIC_AUTH_USER          # optional: set both to password-protect the app
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false
